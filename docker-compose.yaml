services:
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  sftp:
    image: atmoz/sftp
    container_name: sftp_server
    ports:
      - "2222:22" # Externo:Interno
    volumes:
      - ./sftp_data:/home/foo/upload
    environment:
      - SFTP_USERS=foo:pass:1001:::upload
volumes:
  redis_data:
    driver: local
